services:
  kiosk:
    container_name: kiosk
    build:
      context: .
      dockerfile: Dockerfile
    ports: 
      - "9999:9999"
    healthcheck:
      test: ["CMD-SHELL", "curl", "-f", "http://localhost:9999/healthcheck"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 30s
    env_file:
      - .env
